
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#160f22">
<title>A little love for you ❤️</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#160f22;--bg2:#25142b;--pink:#ffb6c9;--rose:#f47caa;
  --gold:#f5d58b;--cream:#fff4e8;--glass:rgba(255,255,255,.075);
  --line:rgba(245,213,139,.35);--shadow:0 18px 55px rgba(0,0,0,.32);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;min-height:100vh;padding:0 0 70px;color:var(--cream);
  font-family:"Cairo",sans-serif;overflow-x:hidden;
  background:
    radial-gradient(ellipse at 15% 8%,rgba(244,124,170,.18),transparent 35%),
    radial-gradient(ellipse at 85% 40%,rgba(245,213,139,.12),transparent 32%),
    linear-gradient(145deg,var(--bg),var(--bg2) 55%,#101a32);
}
body:before{content:"";position:fixed;inset:0;pointer-events:none;z-index:-1;
  background:radial-gradient(circle at 50% 100%,rgba(255,182,201,.08),transparent 45%)}
button,a,textarea{font:inherit}
.ambient{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}
.ambient .moon{position:absolute;top:22px;left:6%;font-size:48px;filter:drop-shadow(0 0 16px rgba(245,213,139,.55))}
.star{position:absolute;width:3px;height:3px;border-radius:50%;background:var(--gold);
  box-shadow:0 0 9px var(--gold);animation:twinkle 2.5s ease-in-out infinite alternate}
@keyframes twinkle{from{opacity:.2;transform:scale(.7)}to{opacity:.9;transform:scale(1.3)}}
.page{position:relative;z-index:1;width:min(850px,93%);margin:auto;padding:36px 0 20px}
.title-frame{
  width:fit-content;max-width:100%;margin:25px auto 30px;padding:15px 28px;text-align:center;
  border:1px solid var(--line);border-radius:22px;background:var(--glass);
  color:var(--pink);font-size:clamp(23px,5vw,34px);font-weight:800;
  box-shadow:var(--shadow);text-shadow:0 0 20px rgba(244,124,170,.3);backdrop-filter:blur(10px)
}
.frame-container{width:min(390px,100%);margin:20px auto 28px;text-align:center}
.frame{padding:8px;border:1px solid var(--gold);border-radius:23px;
  background:linear-gradient(135deg,rgba(245,213,139,.22),rgba(244,124,170,.13));
  box-shadow:0 15px 40px rgba(0,0,0,.3),0 0 25px rgba(245,213,139,.12)}
.photo{width:100%;display:block;border-radius:16px}
.msg-btn,.vbtn,form button{
  display:block;margin:15px auto;padding:11px 25px;border:1px solid rgba(255,255,255,.24);
  border-radius:999px;background:linear-gradient(135deg,#ffe9bd,#f5c77e 55%,#f4a6bd);
  color:#311927;font-size:16px;font-weight:800;cursor:pointer;
  box-shadow:0 8px 24px rgba(244,166,189,.16);transition:transform .2s,filter .2s
}
.msg-btn:hover,.vbtn:hover,form button:hover{transform:translateY(-2px);filter:brightness(1.06)}
#messageBox{max-width:390px;margin:15px auto 28px;padding:9px;border:1px solid var(--line);
  border-radius:20px;background:var(--glass);box-shadow:var(--shadow)}
#messageBox img{width:100%;height:auto;display:block;border-radius:13px}
.video-frame{
  width:min(620px,100%);margin:20px auto 7px;padding:9px;border:1px solid var(--line);
  border-radius:21px;background:var(--glass);box-shadow:var(--shadow);backdrop-filter:blur(8px)
}
.video-frame video{display:block;width:100%;max-height:70vh;border-radius:13px;background:#080710}
.vbtn{margin:8px auto 22px;min-width:190px}
.decor{text-align:center;font-size:22px;letter-spacing:8px;margin:30px 0;color:var(--gold);text-shadow:0 0 15px rgba(245,213,139,.3)}
.footer-text{text-align:center;font-size:clamp(17px,3.8vw,21px);font-weight:600;
  line-height:2;margin:28px auto;padding:22px 16px;max-width:650px;
  border-top:1px solid var(--line);border-bottom:1px solid var(--line);color:#ffe8ed}
.memory-photo{width:min(420px,100%);display:block;margin:28px auto;border-radius:19px;
  border:1px solid var(--gold);padding:6px;background:var(--glass);box-shadow:var(--shadow)}
.form-card{max-width:600px;margin:45px auto 15px;padding:clamp(18px,4vw,30px);
  border:1px solid var(--line);border-radius:25px;background:var(--glass);
  box-shadow:var(--shadow);text-align:center;backdrop-filter:blur(10px)}
.form-card h2{color:var(--pink);font-size:clamp(22px,4vw,28px);margin:0 0 20px}
textarea{
  display:block;width:100%;min-height:140px;padding:14px;border-radius:15px;
  border:1px solid var(--line);background:rgba(15,10,24,.55);color:white;
  resize:vertical;outline:none;line-height:1.8
}
textarea::placeholder{color:#d9bdcd}
textarea:focus{border-color:var(--pink);box-shadow:0 0 0 3px rgba(244,124,170,.12)}
form button{margin:18px auto 0;min-width:150px}
#successMsg{display:none;color:#a8edc0;margin:18px 0 0;font-weight:700}
.floatName{position:fixed;bottom:-30px;font-size:24px;color:var(--pink);
  text-shadow:0 0 12px rgba(244,124,170,.6);animation:floatUp 4s linear;pointer-events:none;z-index:3}
@keyframes floatUp{0%{transform:translateY(0);opacity:1}100%{transform:translateY(-120vh);opacity:0}}
@media(max-width:600px){
  .page{width:94%;padding-top:20px}.ambient .moon{top:10px;left:5%;font-size:38px}
  .title-frame{margin-top:45px;padding:13px 17px}.video-frame{padding:6px}
}
@media(prefers-reduced-motion:reduce){
  *,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important;transition:none!important}
}
</style>
</head>
<body>
<div class="ambient" aria-hidden="true">
  <div class="moon">🌙</div>
</div>

<main class="page">
  <div class="title-frame">💖 كل حكايتنا في مكان واحد</div>

  <div class="frame-container">
    <div class="frame">
      <img src="1764248956999.jpg" class="photo" alt="صورة من ذكرياتنا">
    </div>
  </div>

  <button class="msg-btn" type="button" onclick="toggleMessage()">💌 افتحي رسالتي ليكي</button>
  <div id="messageBox" style="display:none;text-align:center;">
    <img src="Dodo's message.jpg" alt="رسالة دودو">
  </div>

  <div class="video-frame"><video id="v1" playsinline preload="metadata"><source src="D36809643135.mp4"></video></div>
  <button class="vbtn" type="button" onclick="toggleVid('v1',this)">▶ تشغيل / ⏸ إيقاف</button>

  <div class="video-frame"><video id="v2" playsinline preload="metadata"><source src="Asala_details_something.mp4.mp4"></video></div>
  <button class="vbtn" type="button" onclick="toggleVid('v2',this)">▶ تشغيل / ⏸ إيقاف</button>

  <div class="video-frame"><video id="v3" playsinline preload="metadata"><source src="VID_20251128_131744_658.mp4"></video></div>
  <button class="vbtn" type="button" onclick="toggleVid('v3',this)">▶ تشغيل / ⏸ إيقاف</button>

  <div class="video-frame"><video id="v4" playsinline preload="metadata"><source src="R4684478532.mp4"></video></div>
  <button class="vbtn" type="button" onclick="toggleVid('v4',this)">▶ تشغيل / ⏸ إيقاف</button>

  <div class="decor">♡ ✦ ♡ ✦ ♡</div>
  <div class="footer-text" style="border:0;padding:0;margin:12px auto">ذكرى حلوة من 1/12/2025 🥰♥️</div>

  <div class="video-frame"><video id="v5" playsinline preload="metadata"><source src="VID_20251201_000802_188.mp4"></video></div>
  <button class="vbtn" type="button" onclick="toggleVid('v5',this)">▶ تشغيل / ⏸ إيقاف</button>

  <div class="video-frame"><video id="v6" playsinline preload="metadata"><source src="VN٢٠٢٥١٢٠١_٠٠٢١٣٩.mp4"></video></div>
  <button class="vbtn" type="button" onclick="toggleVid('v6',this)">▶ تشغيل / ⏸ إيقاف</button>

  <div class="video-frame"><video id="v7" playsinline preload="metadata"><source src="VID_20260306_004438_075.mp4"></video></div>
  <button class="vbtn" type="button" onclick="toggleVid('v7',this)">▶ تشغيل / ⏸ إيقاف</button>

  <div class="video-frame"><video id="v8" playsinline preload="metadata"><source src="Cfjf883838826_4290cyr3.mp4"></video></div>
  <button class="vbtn" type="button" onclick="toggleVid('v8',this)">▶ تشغيل / ⏸ إيقاف</button>

  <div class="video-frame"><video id="v9" playsinline preload="metadata"><source src="VID_20260318_004903_880.mp4"></video></div>
  <button class="vbtn" type="button" onclick="toggleVid('v9',this)">▶ تشغيل / ⏸ إيقاف</button>

  <div class="decor">♡ ✦ ♡ ✦ ♡</div>

  <img src="IMG_20251201_114150_508.jpg" class="memory-photo" alt="ذكرى خاصة">

  <div class="footer-text">
    أتمنّى أن تدركِ أنني لا أراك كبديلٍ<br>
    أو كخطّةٍ إحتياطيّة<br>
    لطالما رأيتُك الطريقَ كلُّه<br>
    والوصول والنّجاة ♥️🗝
  </div>

  <section class="form-card">
    <h2>💌 سيبيلي رسالة من قلبك</h2>
    <iframe name="hidden_iframe" style="display:none;" title="إرسال الرسالة"></iframe>
    <form action="https://formsubmit.co/bodyashraf244@gmail.com"
          method="POST" target="hidden_iframe" onsubmit="showMessage();">
      <textarea name="message" placeholder="اكتبيلي اللي نفسك تقوليه من قلبك... ❤️" required></textarea>
      <input type="hidden" name="_subject" value="💌 رسالة جديدة من موقع دودو ❤️">
      <input type="hidden" name="_captcha" value="false">
      <button type="submit">إرسال ✨</button>
    </form>
    <p id="successMsg">وصلتني رسالتك يا أجمل دودو 🤍</p>
  </section>
</main>

<script>
function toggleMessage(){
  const box=document.getElementById("messageBox");
  box.style.display=box.style.display==="none"?"block":"none";
}
function toggleVid(id,btn){
  const video=document.getElementById(id);
  if(video.paused){
    video.play().then(()=>{btn.innerHTML="⏸ إيقاف";})
      .catch(()=>{btn.innerHTML="تعذّر التشغيل، اضغط تاني";});
  }else{
    video.pause();btn.innerHTML="▶ تشغيل / ⏸ إيقاف";
  }
}
document.querySelectorAll(".video-frame video").forEach(video=>{
  video.addEventListener("ended",()=>{
    const button=video.parentElement.nextElementSibling;
    if(button && button.classList.contains("vbtn"))button.innerHTML="▶ تشغيل / ⏸ إيقاف";
  });
});
function showMessage(){
  setTimeout(()=>{
    document.getElementById("successMsg").style.display="block";
  },800);
}
for(let i=0;i<40;i++){
  const s=document.createElement("div");
  s.className="star";
  s.style.top=Math.random()*100+"vh";
  s.style.left=Math.random()*100+"vw";
  s.style.animationDelay=(Math.random()*2)+"s";
  document.querySelector(".ambient").appendChild(s);
}
function createFloatingName(){
  const t=document.createElement("div");
  t.className="floatName";
  t.innerHTML="❤️ دودو";
  t.style.left=Math.random()*Math.max(0,window.innerWidth-100)+"px";
  document.body.appendChild(t);
  setTimeout(()=>t.remove(),4000);
}
setInterval(createFloatingName,1200);
</script>
</body>
</html>
